name: Automated Twice-Daily YouTube Shorts Publisher

on:
  schedule:
    # 15:30 UTC = 11:30 AM EST (US Lunchtime peak)
    - cron: '30 15 * * *'
    # 22:30 UTC = 6:30 PM EST (US Evening peak)
    - cron: '30 22 * * *'
  workflow_dispatch: # Allows clicking "Run workflow" in GitHub UI anytime

permissions:
  contents: write

jobs:
  publish_short:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install System Dependencies (FFmpeg, Chrome, Xvfb)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg xvfb
          npx playwright install --with-deps chromium

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cloud.txt

      - name: Autonomous Video Creation & Scheduling on GitHub Servers
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SOFTWARE_GL: "1"
          CHROME: "/usr/bin/google-chrome"
        run: |
          xvfb-run --auto-servernum python tools/run_scheduled_job.py

      - name: Commit and Push Updates Back to GitHub
        run: |
          git config user.name "MicroDocs Automation Bot"
          git config user.email "bot@microdocs.media"
          git add queue.json videos/ template_deep_dive/ tools/
          git commit -m "Auto-generated & scheduled next 3D short on YouTube [skip ci]" || echo "No changes to commit"
          git push origin main
